services:
  skyinnk:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    ports:
      - "127.0.0.1:3005:3005"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3005

    restart: unless-stopped
    init: true

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3005/api/v1/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  skyinnk-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build

    env_file:
      - .env

    profiles:
      - migration
