name: Development PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - development/v1-public-launch
  push:
    branches:
      - development/v1-public-launch

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: skyinnk-development-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  development-ci:
    name: Development CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Enforce PR branch, task ownership and overlapping-file policy
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-pr-governance.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Run lightweight tests
        run: npm run test:all

      - name: Validate Prisma, types and production build
        run: npm run check:all
