name: SDC GitHub Agentic Workflow Compiler Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [development/v1-public-launch]
    paths:
      - .github/workflows/skyinnk-sdc-cycle.md
      - .github/workflows/skyinnk-sdc-cycle.lock.yml
      - .github/workflows/skyinnk-gh-aw-compile.yml

permissions:
  contents: read

concurrency:
  group: skyinnk-sdc-gh-aw-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-validate:
    if: github.repository == 'codewptech/skyinnk'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout proposed GitHub-only AI workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install official GitHub Agentic Workflows compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-aw
          gh aw --version
      - name: Compile and validate exact committed lock without any AI model inference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s .github/workflows/skyinnk-sdc-cycle.lock.yml
          gh aw compile
          git diff --exit-code -- .github/workflows/skyinnk-sdc-cycle.lock.yml || {
            echo "::error::Committed gh-aw lock differs from official compiler output."
            exit 1
          }
          echo "Official gh-aw compile successful; committed lock matches."
      - name: Upload generated lock for source provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skyinnk-sdc-gh-aw-compiled-lock
          path: .github/workflows/skyinnk-sdc-cycle.lock.yml
          if-no-files-found: error
          retention-days: 7
