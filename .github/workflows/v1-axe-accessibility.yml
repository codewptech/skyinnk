name: V1 Automated WCAG Browser Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - development/v1-public-launch
    paths:
      - app/pages/**
      - app/components/**
      - app/utils/**
      - content/catalogue.json
      - shared/public-content.ts
      - scripts/validate-public-content.ts
      - nuxt.config.ts
      - package.json
      - package-lock.json
      - scripts/smoke-v1.mjs
      - scripts/smoke-axe-public.mjs
      - .github/workflows/v1-axe-accessibility.yml
  push:
    branches:
      - development/v1-public-launch
    paths:
      - app/pages/**
      - app/components/**
      - app/utils/**
      - content/catalogue.json
      - shared/public-content.ts
      - scripts/validate-public-content.ts
      - nuxt.config.ts
      - package.json
      - package-lock.json
      - scripts/smoke-v1.mjs
      - scripts/smoke-axe-public.mjs
      - .github/workflows/v1-axe-accessibility.yml

permissions:
  contents: read

jobs:
  axe-wcag:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Chromium axe-core WCAG 2/2.1 A/AA
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NUXT_PUBLIC_ANALYTICS_ENABLED: "false"
      DATABASE_URL: postgresql://fixture:fictional@127.0.0.1:1/fixture
      DIRECT_URL: postgresql://fixture:fictional@127.0.0.1:1/fixture
      NUXT_AUTH0_DOMAIN: validation.example.invalid
      NUXT_AUTH0_CLIENT_ID: fictional-test-only
      NUXT_AUTH0_CLIENT_SECRET: fictional-client-secret-no-live-service
      NUXT_AUTH0_SESSION_SECRET: fictional-session-secret-not-for-production
      NUXT_AUTH0_APP_BASE_URL: http://127.0.0.1:4318
      NITRO_HOST: 127.0.0.1
      NITRO_PORT: "4318"
    steps:
      - name: Checkout in-repo candidate or integrated development
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install locked application and ephemeral browser auditor
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Audit real empty-catalogue Nuxt pages
        shell: bash
        run: |
          set -euo pipefail
          npm run check:all
          node .output/server/index.mjs > "$RUNNER_TEMP/axe-empty.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true; wait "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:4318/api/v1/health >/dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/axe-empty.log"; exit 1; fi
          node scripts/smoke-axe-public.mjs http://127.0.0.1:4318 empty

      - name: Audit fictional published course, lessons, panels and mobile dialog
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/axe-published"
          mkdir -p "$artifacts"
          node scripts/smoke-v1.mjs --isolated-fixture --serve-fixture --artifacts "$artifacts" --port 4319 > "$artifacts/controller.log" 2>&1 &
          fixture_pid=$!
          trap 'kill -TERM "$fixture_pid" >/dev/null 2>&1 || true; wait "$fixture_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 180); do
            if grep -q FIXTURE_READY "$artifacts/controller.log" && test -s "$artifacts/fixture-parameters.json"; then ready=1; break; fi
            if ! kill -0 "$fixture_pid" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat "$artifacts/controller.log"; exit 1; fi
          node scripts/smoke-axe-public.mjs http://127.0.0.1:4319 published
