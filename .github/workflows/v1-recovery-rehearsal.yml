name: V1 Disposable Recovery Rehearsal

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - development/v1-public-launch
    paths:
      - .github/workflows/v1-recovery-rehearsal.yml
      - scripts/rehearse-v1-recovery.sh
      - scripts/check-release-authorization.mjs
      - tests/release-authorization.test.mjs

permissions:
  contents: read

jobs:
  rehearsal:
    if: ${{ github.event.pull_request.number == 28 && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Isolated Docker and PostgreSQL 18 recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Confirm isolated runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_REPOSITORY" = codewptech/skyinnk
          docker info >/dev/null
          test -S /var/run/docker.sock

      - name: Build disposable app image and fetch PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:18-bookworm
          docker build --pull --tag skyinnk-rehearsal:local .

      - name: Test backup restore, failed readiness and prior-image recovery
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/rehearse-v1-recovery.sh skyinnk-rehearsal:local \
            | tee "$RUNNER_TEMP/skyinnk-recovery-rehearsal.log"
          grep -F 'Verified backup restore with a fictional record' "$RUNNER_TEMP/skyinnk-recovery-rehearsal.log"
          grep -F 'Restored prior runtime ' "$RUNNER_TEMP/skyinnk-recovery-rehearsal.log"

      - name: Verify proposed owner gate without production credentials
        shell: bash
        run: node --test tests/release-authorization.test.mjs
